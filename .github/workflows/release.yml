name: Release

# Trailer-gated release for the package library. Card work is validated
# locally with `just ci::check` (AGENTS.md); this workflow runs only on
# pushes to main and on manual runs. It always runs the merge bar. It tags
# and publishes a GitHub release only when HEAD of main carries a trailer:
#   pre-release: true   -> vX.Y.Z-alpha, marked as a GitHub pre-release
#   release: true       -> vX.Y.Z (promotes vX.Y.Z-alpha when that is the last tag)
# Neither trailer -> the check only.
#
# No paths filter: a release commit that changes nothing (an empty
# `chore: release` with `release: true`) must still run.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ── Check ─────────────────────────────────────────────────────────────────
  # The merge bar, against the config-weave release pinned in the justfile
  # (config_weave_version). Installs that release's static linux binary and
  # checks it against the release's SHA256SUMS: no cargo build needed.
  check:
    name: just ci::check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@just

      - name: Install pinned config-weave
        run: |
          set -euo pipefail
          TAG=$(just --evaluate config_weave_version)
          DIR="$RUNNER_TEMP/config-weave"
          mkdir -p "$DIR"
          cd "$DIR"
          BASE="https://github.com/configweave/config-weave/releases/download/${TAG}"
          curl -fsSLO "${BASE}/config-weave-linux-x86_64"
          curl -fsSLO "${BASE}/SHA256SUMS"
          # An empty grep result makes sha256sum fail: no unchecked binary runs.
          grep ' config-weave-linux-x86_64$' SHA256SUMS | sha256sum -c -
          chmod +x config-weave-linux-x86_64
          echo "CONFIG_WEAVE=${DIR}/config-weave-linux-x86_64" >> "$GITHUB_ENV"
          echo "config-weave ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check
        run: just ci::check

  # ── Version ───────────────────────────────────────────────────────────────
  # Same scheme as config-weave's CI (with the promotion fix of wscript
  # 3dea26c): bump from the highest v* tag reachable from HEAD, scanning
  # conventional-commit subjects since that tag (0.x semantics: a breaking
  # change bumps the minor, not the major). Tags sort with
  # versionsort.suffix=-alpha, so vX.Y.Z ranks above vX.Y.Z-alpha.
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: calc
        run: |
          IS_RELEASE=$(git log -1 --format='%(trailers:key=release,valueonly)')
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')
          # Optional bump override from HEAD's bump: trailer. Checked before the
          # skip below, so a bad value always fails.
          BUMP_TRAILER=$(git log -1 --format='%(trailers:key=bump,valueonly)')
          if [[ -n "$BUMP_TRAILER" && ! "$BUMP_TRAILER" =~ ^(major|minor|patch)$ ]]; then
            echo "::error::bump: trailer must be major, minor or patch, got '$BUMP_TRAILER'" >&2
            exit 1
          fi

          if [[ "$IS_RELEASE" != "true" && "$IS_PRERELEASE" != "true" ]]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No release/pre-release trailer on HEAD: check only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Highest version among the tags reachable from HEAD, not the
          # nearest one by commit distance. versionsort.suffix=-alpha ranks
          # v0.3.0 above v0.3.0-alpha: without it git ranks the suffixed tag
          # higher, and a stable tag never becomes LAST_TAG.
          LAST_TAG=$(git -c versionsort.suffix=-alpha tag --list 'v*' --merged HEAD --sort=-v:refname | head -1)
          PROMOTE_FROM=""
          if [[ -z "$LAST_TAG" ]]; then
            PREV_MAJOR=0; PREV_MINOR=0; PREV_PATCH=0; RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"; VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
            # A release on top of a pre-release tag promotes it: vX.Y.Z-alpha
            # becomes vX.Y.Z, with no bump, unless vX.Y.Z already exists.
            if [[ "$IS_RELEASE" == "true" && "$LAST_TAG" == *-* && -z "$(git tag --list "v$VER")" ]]; then
              PROMOTE_FROM="$LAST_TAG"
            fi
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' $RANGE)
          [[ "$BUMP" == "none" ]] && BUMP="patch"
          # A bump: trailer replaces the scanned bump. A promotion below still wins.
          if [[ -n "$BUMP_TRAILER" ]]; then BUMP="$BUMP_TRAILER"; fi

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then MAJOR=0; MINOR=$((PREV_MINOR + 1)); PATCH=0
              else MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0; fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PRERELEASE=false
          if [[ "$IS_PRERELEASE" == "true" && -z "$PROMOTE_FROM" ]]; then
            VERSION="${VERSION}-alpha"
            PRERELEASE=true
          fi
          if [[ -n "$PROMOTE_FROM" ]]; then
            VERSION="$VER"
            BUMP="promoted from ${PROMOTE_FROM}"
          fi

          echo "Calculated version: $VERSION (bump=$BUMP, prerelease=$PRERELEASE, from ${LAST_TAG:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Pre-release** | $PRERELEASE |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── Release ───────────────────────────────────────────────────────────────
  # Tag the commit (annotated, like the seed tag v0.1.0-alpha) and publish a
  # GitHub (pre-)release. No binaries: the asset is a tarball of pkgs/ and
  # README.md, plus its SHA256SUMS.
  release:
    name: Create GitHub release
    needs: [version, check]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package
        run: |
          set -euo pipefail
          V="v${{ needs.version.outputs.version }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="config-weave-pkgs-${V}/" \
            -o "dist/config-weave-pkgs-${V}.tar.gz" HEAD pkgs README.md
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Tag
        run: |
          set -euo pipefail
          V="v${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "$V"
          git push origin "$V"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
